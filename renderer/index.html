<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetroLimpia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">Retro<b>Limpia</b></span>
      <span class="ver" id="ver"></span>
    </div>
    <div class="titlebar-status" id="titlebarStatus"></div>
    <div class="win-btns">
      <button data-win="min" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="max" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
      <button data-win="close" class="close" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="nav"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-back hidden" id="modal"></div>
  <div class="tour hidden" id="tour" role="dialog" aria-modal="true" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
